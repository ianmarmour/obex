[package]
# `obex` is taken on crates.io; the library is still imported as `obex`.
name = "obex-protocol"
version = "0.1.0"
authors = ["Ian Armour <ianmarmour@gmail.com>"]
description = """
Native OBEX 1.5 (IrDA Object Exchange) implementation in Rust, usable over Bluetooth RFCOMM/L2CAP, IrDA or TCP.
"""
edition = "2021"
rust-version = "1.85"
readme = "README.md"
repository = "https://github.com/ianmarmour/obex"
license = "MIT"
keywords = ["obex", "bluetooth", "irda", "goep"]
categories = ["encoding", "network-programming"]
# The specifications are copyrighted by their publishers, so they stay out of the package.
exclude = ["docs/", ".devcontainer/", ".github/"]

[lib]
name = "obex"
path = "src/lib.rs"

[features]
# Async client, server and packet stream for tokio, in `obex::tokio`.
tokio = ["dep:tokio"]

[dependencies]
nom = "7.1.1"
tokio = { version = "1", optional = true, default-features = false, features = ["io-util"] }

[dev-dependencies]
libc = "0.2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }

[[example]]
name = "tokio_loopback"
required-features = ["tokio"]

[package.metadata.docs.rs]
all-features = true
