[package]
name = "obex"
version = "0.0.1"
authors = ["Ian Armour <ianmarmour@gmail.com>"]
description = """
Native OBEX 1.4 Implementation in Rust
"""
edition = "2021"
readme = "README.md"
repository = "https://github.com/ianmarmour/obex"
license = "MIT"
keywords = ["obex", "bluetooth", "irda"]
categories = ["encoding", "network-programming"]

[lib]
path = "src/lib.rs"

[dependencies]
nom = "7.1.1"
ascii = "1.1"